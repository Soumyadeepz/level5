name: deploy to ec2
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs_on: ubuntu-latest #jakhan deploy hobe github ubuntu machine sob action perform korbe
  steps:
    - name: checkout code # check korbe code a kono problem ache naki
      uses: actions/checkout@v6 # checkaut korbe 
    - name: deploy via ssh
      uses: appleboy/ssh-action@v1 # ssh perform korar janna kono na kono action perform korbe 
      with: 
        host: ${{secrets.SSH_HOST}}
        username: ubuntu
        key: ${{secrets.SSH_KEY}}
        script: |
          cd ~/level5
          git pull
          sudo docker compose down
          sudo docker compose up -d --build


